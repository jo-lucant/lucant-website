<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<title>LUCANT</title>
<meta name="robots" content="noindex"/>
<style>
  body{margin:0;background:#0f0e0b;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .logo{font-family:Georgia,serif;font-size:1.5rem;color:#e8a320;letter-spacing:.1em}
</style>
</head>
<body>
<div class="logo">L·</div>
<script>
  // Detect browser language — default to Spanish for Colombian/Spanish-speaking users
  const lang = navigator.language || navigator.userLanguage || 'es';
  const isSpanish = lang.toLowerCase().startsWith('es');
  // Check if user has manually selected a language before
  const stored = localStorage.getItem('lucant_lang');
  const target = stored || (isSpanish ? 'es' : 'en');
  window.location.replace('/' + target + '/');
</script>
</body>
</html>
